{% load static tailwind_tags %}

<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Internal System</title>

    {% tailwind_css %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body class="min-h-screen flex items-center justify-center font-['Kanit'] bg-[#F5F5F5] p-6 relative overflow-hidden">
    
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-[#5651FF]/5 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-[#5651FF]/5 rounded-full blur-[100px]"></div>

    <div class="card w-full max-w-md bg-[#FFFFFF] border border-gray-100 shadow-[0_20px_50px_rgba(0,0,0,0.04)] rounded-[2rem] overflow-hidden z-10">
        <div class="card-body p-8 md:p-12">

            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-[#5651FF] text-white rounded-2xl mb-5 shadow-lg shadow-[#5651FF]/20">
                    <i class="fas fa-lock text-2xl"></i>
                </div>
                <h4 class="text-2xl font-bold text-[#1A1A1A] tracking-tight">เข้าสู่ระบบ</h4>
                <p class="text-gray-400 text-sm mt-2">เฉพาะเจ้าหน้าที่และผู้ได้รับอนุญาตเท่านั้น</p>
            </div>

            {% if messages %}
            <div class="space-y-3 mb-6">
                {% for message in messages %}
                <div role="alert"
                    class="flex items-center gap-3 p-4 text-sm rounded-2xl {% if message.tags == 'error' %}bg-[#D3302F]/10 text-[#D3302F]{% elif message.tags == 'success' %}bg-[#00964F]/10 text-[#00964F]{% else %}bg-[#3ABFF8]/10 text-[#3ABFF8]{% endif %} transition-all animate-in fade-in duration-300">
                    <i class="fas fa-circle-info"></i>
                    <span class="font-medium">{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div class="form-control w-full">
                    <label class="label px-1">
                        <span class="label-text font-semibold text-gray-600">อีเมลผู้ใช้งาน</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                            <i class="far fa-envelope text-sm"></i>
                        </span>
                        <input type="email" name="email" placeholder="example@domain.com" required
                            class="input input-bordered w-full h-12 pl-11 rounded-xl bg-gray-50 border-gray-200 focus:bg-white focus:border-[#5651FF] focus:ring-2 focus:ring-[#5651FF]/10 transition-all text-gray-900 shadow-sm" />
                    </div>
                </div>

                <div class="form-control w-full">
                    <div class="flex justify-between items-center mb-1 px-1">
                        <label class="label-text font-semibold text-gray-600">รหัสผ่าน</label>
                        <a href="{% url 'users:password_reset' %}" class="text-xs font-bold text-[#5651FF] hover:text-[#4843E6] transition-colors">
                            ลืมรหัสผ่าน?
                        </a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                            <i class="fas fa-key text-xs"></i>
                        </span>
                        <input type="password" name="password" placeholder="••••••••" required
                            class="input input-bordered w-full h-12 pl-11 rounded-xl bg-gray-50 border-gray-200 focus:bg-white focus:border-[#5651FF] focus:ring-2 focus:ring-[#5651FF]/10 transition-all text-gray-900 shadow-sm" />
                    </div>
                </div>

                <button type="submit"
                    class="btn border-none bg-[#5651FF] hover:bg-[#4843E6] w-full h-12 rounded-xl text-white text-base font-bold shadow-md shadow-[#5651FF]/20 hover:shadow-lg active:scale-[0.98] transition-all duration-200 mt-4 group">
                    <span>เข้าสู่ระบบ</span>
                    <i class="fas fa-sign-in-alt ml-2 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>

            <div class="mt-10 pt-6 border-t border-gray-50">
                <p class="text-center text-[10px] text-gray-300 uppercase tracking-widest font-medium">
                    &copy; 2026 Internal Management System
                </p>
            </div>

        </div>
    </div>

</body>
</html>
