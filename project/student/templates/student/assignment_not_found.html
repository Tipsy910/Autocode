{% extends "base.html" %}

{% block title %}ไม่พบงาน - Autocode Grad{% endblock %}

{% block content %}
<div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 70vh;">
    
    <div class="text-center animate__animated animate__fadeIn">
        <div class="mb-4">
            <span class="fa-stack fa-4x text-muted opacity-50">
                <i class="fas fa-file fa-stack-1x"></i>
                <i class="fas fa-ban fa-stack-2x text-danger"></i>
            </span>
        </div>

        <h1 class="display-6 fw-bold text-secondary mb-3">ไม่พบงานที่คุณต้องการ</h1>
        <p class="lead text-muted mb-5">
            งานนี้อาจถูกลบไปแล้ว หรือคุณอาจเข้าผ่านลิงก์ที่ไม่ถูกต้อง
        </p>

        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="{% url 'student:dashboard' %}" class="btn btn-primary btn-lg px-5 shadow-sm rounded-pill">
                <i class="fas fa-home me-2"></i> กลับหน้าหลัก
            </a>
            
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg px-5 rounded-pill">
                <i class="fas fa-arrow-left me-2"></i> ย้อนกลับ
            </a>
        </div>
    </div>

</div>
{% endblock %}
