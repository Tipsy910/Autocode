{% extends "base.html" %}

{% block content %}
<div class="min-h-[60vh] flex flex-col justify-center items-center py-12 px-4">

    <div class="mb-6 text-gray-300">
        <i class="fas fa-search-minus text-9xl opacity-50"></i>
    </div>

    <h2 class="text-3xl font-bold text-[#1A1A1A] mb-4 text-center">
        {{ error_title|default:"ไม่พบข้อมูลที่คุณค้นหา" }}
    </h2>

    <p class="text-gray-500 mb-8 text-center max-w-lg text-lg">
        {{ error_message|default:"ข้อมูลนี้อาจถูกลบไปแล้ว หรือคุณไม่มีสิทธิ์เข้าถึงหน้านี้" }}
    </p>

    <a href="{{ back_url|default:'/' }}"
        class="btn bg-[#5651FF] border-[#5651FF] text-white hover:bg-[#4843E6] rounded-full px-8 py-2 shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">
        <i class="fas fa-arrow-left mr-2"></i> กลับหน้ารายการ
    </a>

</div>
{% endblock %}
