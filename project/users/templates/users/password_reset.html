{% extends "base.html" %}



{% block content %}

<div class="min-h-screen bg-[#F5F5F5] flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-[#5651FF]/5 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[30%] h-[30%] bg-[#5651FF]/5 rounded-full blur-[80px]"></div>
    <div class="sm:mx-auto sm:w-full sm:max-w-md z-10">

        <div class="card bg-[#FFFFFF] border border-gray-100 shadow-[0_20px_50px_rgba(0,0,0,0.04)] rounded-[2rem] overflow-hidden">
            <div class="card-body p-8 md:p-10">
                <div class="text-center mb-10">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-[#5651FF]/10 text-[#5651FF] rounded-2xl mb-5">
                        <i class="fas fa-key text-2xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-[#1A1A1A] tracking-tight">ลืมรหัสผ่าน?</h3>
                    <p class="text-gray-400 mt-2 text-sm leading-relaxed">
                        ไม่ต้องกังวล! เพียงกรอกอีเมลของคุณ <br>
                        เราจะส่งลิงก์ตั้งค่ารหัสผ่านใหม่ไปให้ทันที
                    </p>

                </div>
                <form method="POST" class="space-y-6">
                    {% csrf_token %}
                    <div class="form-control w-full">
                        <label class="label px-1">
                            <span class="label-text font-semibold text-gray-600">อีเมลผู้ใช้งาน</span>

                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">

                                <i class="far fa-envelope text-sm"></i>
                            </span>
                            {{ form.email }}
                        </div>
                    </div>
                    <button type="submit"
                        class="btn border-none bg-[#5651FF] hover:bg-[#4843E6] w-full h-12 rounded-xl text-white text-base font-bold shadow-md shadow-[#5651FF]/20 hover:shadow-lg active:scale-[0.98] transition-all duration-200 group">
                        <span>ส่งลิงก์กู้คืนรหัสผ่าน</span>
                        <i class="fas fa-paper-plane ml-2 text-xs group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
                    </button>
                </form>
                <div class="mt-8 text-center pt-6 border-t border-gray-50">
                    <a href="{% url 'login' %}"
                        class="text-sm font-bold text-gray-400 hover:text-[#5651FF] transition-colors inline-flex items-center">
                        <i class="fas fa-arrow-left mr-2 text-xs"></i> กลับไปหน้าเข้าสู่ระบบ
                    </a>
                </div>
            </div>
        </div>
        <p class="text-center mt-8 text-[11px] text-gray-400 uppercase tracking-widest font-medium">
            Internal Security Protocol System
        </p>
    </div>
</div>
<script>
    // ปรับแต่ง Input ของ Django ให้เข้ากับ UI ใหม่
    document.querySelectorAll("input").forEach(i => {

        i.classList.add(
            "input", "input-bordered", "w-full", "h-12", "pl-11",
            "rounded-xl", "bg-gray-50", "border-gray-200",
            "focus:bg-white", "focus:border-[#5651FF]", "focus:ring-2",
            "focus:ring-[#5651FF]/10", "focus:outline-none", "transition-all",
            "text-gray-900", "shadow-sm"
        );
        i.placeholder = "example@domain.com";
    });

</script>

{% endblock %}
