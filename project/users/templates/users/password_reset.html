{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">ลืมรหัสผ่าน?</h3>
                    <p class="text-muted text-center mb-4">กรอกอีเมลของคุณเพื่อรับลิงก์สำหรับตั้งรหัสผ่านใหม่</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">อีเมล</label>
                            {{ form.email }} </div>
                        <button type="submit" class="btn btn-primary w-100">ส่งคำขอ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll("input").forEach(i => i.classList.add("form-control"));
</script>
{% endblock %}
