{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-[#F5F5F5] flex items-center justify-center py-12 px-4 relative overflow-hidden">
    
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-[#00964F]/5 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[35%] h-[35%] bg-[#5651FF]/5 rounded-full blur-[90px]"></div>

    <div class="card bg-[#FFFFFF] border border-gray-100 shadow-[0_20px_50px_rgba(0,0,0,0.04)] max-w-md w-full text-center rounded-[2.5rem] z-10">
        <div class="card-body p-10 md:p-14">
            
            <div class="mb-10">
                <div class="relative inline-flex">
                    <div class="absolute inset-0 bg-[#00964F] opacity-10 rounded-full scale-150 animate-pulse"></div>
                    <div class="w-20 h-20 bg-[#00964F] text-white rounded-full flex items-center justify-center relative z-10 shadow-lg shadow-[#00964F]/20">
                        <i class="fas fa-check text-3xl"></i>
                    </div>
                </div>
            </div>

            <h2 class="text-2xl font-bold text-[#1A1A1A] mb-4 tracking-tight">ตั้งค่ารหัสผ่านสำเร็จ!</h2>
            <p class="text-gray-500 text-base leading-relaxed mb-10">
                เปลี่ยนรหัสผ่านใหม่เรียบร้อยแล้ว <br>
                ขณะนี้คุณสามารถเข้าสู่ระบบได้ทันที
            </p>

            <a href="{% url 'login' %}"
                class="btn border-none bg-[#5651FF] hover:bg-[#4843E6] w-full h-14 rounded-2xl text-white text-lg font-bold shadow-lg shadow-[#5651FF]/20 hover:shadow-xl active:scale-[0.97] transition-all duration-300 group flex items-center justify-center gap-3 no-underline">
                <span class="tracking-wide">เข้าสู่ระบบตอนนี้</span>
                <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-white/20 transition-colors">
                    <i class="fas fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                </div>
            </a>

        </div>
    </div>

    <div class="absolute bottom-8 w-full text-center">
        <p class="text-[10px] text-gray-300 uppercase tracking-[0.2em] font-medium">
            Account Access Restored
        </p>
    </div>
</div>
{% endblock %}
