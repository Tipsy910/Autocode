{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">ตั้งรหัสผ่านใหม่</div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label">{{ field.label }}</label>
                                {{ field }}
                                {% if field.help_text %}
                                    <div class="form-text small">{{ field.help_text|safe }}</div>
                                {% endif %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-success w-100">บันทึกรหัสผ่านใหม่</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll("input").forEach(i => i.classList.add("form-control"));
</script>
{% endblock %}
