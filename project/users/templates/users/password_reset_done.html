{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-[#F5F5F5] flex items-center justify-center py-12 px-4 relative overflow-hidden">
    
    <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-[#3ABFF8]/5 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[35%] h-[35%] bg-[#5651FF]/5 rounded-full blur-[90px]"></div>

    <div class="card bg-[#FFFFFF] border border-gray-100 shadow-[0_20px_50px_rgba(0,0,0,0.04)] max-w-md w-full text-center rounded-[2.5rem] z-10">
        <div class="card-body p-10 md:p-14">
            
            <div class="mb-8">
                <div class="relative inline-flex">
                    <div class="absolute inset-0 bg-[#3ABFF8] opacity-20 rounded-full animate-ping"></div>
                    <div class="w-20 h-20 bg-[#3ABFF8]/10 rounded-full flex items-center justify-center relative z-10">
                        <i class="fas fa-paper-plane text-3xl text-[#3ABFF8]"></i>
                    </div>
                </div>
            </div>

            <h3 class="text-2xl font-bold text-[#1A1A1A] mb-4 tracking-tight">ส่งอีเมลเรียบร้อยแล้ว</h3>
            
            <div class="space-y-3">
                <p class="text-gray-500 text-base leading-relaxed">
                    เราได้ส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ <br>
                    ไปที่อีเมลของคุณเรียบร้อยแล้ว
                </p>
                
                <div class="bg-gray-50 rounded-2xl p-4 mt-6">
                    <p class="text-[13px] text-gray-400 leading-relaxed">
                        <i class="fas fa-info-circle mr-1 text-[#3ABFF8]"></i>
                        หากไม่พบอีเมลในกล่องจดหมาย <br>
                        กรุณาตรวจสอบใน <b>จดหมายขยะ (Spam)</b>
                    </p>
                </div>
            </div>

            <div class="mt-10">
                <a href="{% url 'login' %}" 
                   class="btn btn-ghost btn-sm text-gray-400 hover:text-[#5651FF] hover:bg-transparent transition-all font-bold">
                    <i class="fas fa-arrow-left mr-2 text-xs"></i> กลับไปหน้าเข้าสู่ระบบ
                </a>
            </div>
        </div>
    </div>

    <div class="absolute bottom-8 w-full text-center">
        <p class="text-[10px] text-gray-300 uppercase tracking-[0.2em] font-medium">
            Mail Delivery Status: Confirmed
        </p>
    </div>
</div>
{% endblock %}
